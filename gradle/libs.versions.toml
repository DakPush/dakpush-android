[versions]
agp = "8.13.2"
kotlin = "2.2.21"
# The stdlib apps get: Kotlin 2.0 apps can use the SDK (Firebase needs 2.0 too).
kotlinStdlib = "2.0.21"
googleServices = "4.4.4"
# The newest Firebase Messaging that runs on minSdk 23 (26 needs 24), and new
# enough for Firebase Installation IDs (25.1). Apps on a newer Firebase BoM
# get theirs.
firebaseMessaging = "25.1.3"
# 1.13 keeps the apps' compileSdk at 34 or higher.
androidxCore = "1.13.1"
androidxActivity = "1.9.3"
junit = "4.13.2"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
mockwebserver = "4.12.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinStdlib" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
