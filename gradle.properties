org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Names
# The product is DakPush. The group and package are temporary until its
# domain is bought. Everything that names the SDK is here; the Kotlin
# package in the sources follows dak.namespace, and scripts/rename.sh
# changes both together:
#   scripts/rename.sh com.example.dakpush com.example
dak.group=io.github.hridoyrocks
dak.artifact=dakpush-android
dak.namespace=io.github.hridoyrocks.dak
dak.version=0.2.0

# The example app. A real push needs a google-services.json for this
# package in example/ (git-ignored). To use another package, put
# dak.exampleApplicationId=com.you.test in local.properties (git-ignored).
dak.exampleApplicationId=io.github.hridoyrocks.dak.example
